apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysite
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mysite
  template:
    metadata:
      labels:
        app: mysite
    spec:
      containers:
        - name: web
          image: ghcr.io/bhagyashrij2206/mysite:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mysite
spec:
  selector:
    app: mysite
  ports:
    - port: 80
      targetPort: 80
