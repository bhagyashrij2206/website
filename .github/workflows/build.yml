name: Build and test

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t mysite .
      - name: Start a container
        run: docker run -d -p 8080:80 --name web mysite
      - name: Test the page
        run: sleep 2 && curl --fail http://localhost:8080 | grep "My first site"
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push the image
        run: |
          docker tag mysite ghcr.io/bhagyashrij2206/mysite:latest
          docker push ghcr.io/bhagyashrij2206/mysite:latest
